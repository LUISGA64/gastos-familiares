{% extends 'gastos/base.html' %}

{% block title %}Cambiar Contraseña - FinanBot{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3 class="mb-0">
                        <i class="bi bi-key"></i> Cambiar Contraseña
                    </h3>
                </div>

                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="password_actual" class="form-label">Contraseña Actual</label>
                            <input type="password" class="form-control" id="password_actual" name="password_actual" required>
                        </div>

                        <div class="mb-3">
                            <label for="password_nueva" class="form-label">Nueva Contraseña</label>
                            <input type="password" class="form-control" id="password_nueva" name="password_nueva" required minlength="12">
                            <small class="form-text text-muted">
                                Debe tener al menos 12 caracteres, incluir mayúsculas, minúsculas, números y caracteres especiales.
                            </small>
                        </div>

                        <div class="mb-4">
                            <label for="password_nueva2" class="form-label">Confirmar Nueva Contraseña</label>
                            <input type="password" class="form-control" id="password_nueva2" name="password_nueva2" required minlength="12">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Cambiar Contraseña
                            </button>
                            <a href="{% url 'mis_datos' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
